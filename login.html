<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Nemo社区</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">N</div>
        <span>Nemo社区</span>
      </a>
      <div class="nav-menu">
        <a href="index.html">精选</a>
        <a href="circles.html">圈子</a>
        <a href="ranking.html">榜单</a>
        <a href="sites.html">优站</a>
      </div>
      <div class="nav-actions">
        <button class="nav-icon-btn" id="theme-toggle" title="切换主题">☾</button>
        <button class="nav-icon-btn" title="搜索">🔍</button>
        <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      </div>
    </div>
  </nav>

  <!-- 移动端菜单 -->
  <div class="mobile-menu" id="mobile-menu">
    <a href="index.html">精选</a>
    <a href="circles.html">圈子</a>
    <a href="ranking.html">榜单</a>
    <a href="sites.html">优站</a>
  </div>

  <!-- 登录卡片 -->
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">N</div>
        <h2>欢迎回来</h2>
        <p>登录 Nemo 社区，发现更多精彩内容</p>
      </div>

      <form onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="username">账号</label>
          <input type="text" id="username" class="form-input" placeholder="请输入用户名/邮箱" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password">
        </div>

        <div class="form-row">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" checked style="accent-color: var(--primary);">
            <span>记住我</span>
          </label>
          <a href="#">忘记密码？</a>
        </div>

        <button type="submit" class="auth-submit-btn">登录</button>
      </form>

      <div class="auth-footer">
        还没有账号？<a href="register.html">立即注册</a>
      </div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-brand">
          <h3>Nemo社区</h3>
          <p>汇聚热爱技术与生活的创作者<br>分享知识，探索有趣的一切</p>
        </div>
        <div class="footer-col">
          <h4>社区</h4>
          <ul>
            <li><a href="index.html">精选文章</a></li>
            <li><a href="circles.html">兴趣圈子</a></li>
            <li><a href="ranking.html">社区榜单</a></li>
            <li><a href="sites.html">精选优站</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>关于</h4>
          <ul>
            <li><a href="#">关于我们</a></li>
            <li><a href="#">加入我们</a></li>
            <li><a href="#">联系我们</a></li>
            <li><a href="#">意见反馈</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>帮助</h4>
          <ul>
            <li><a href="#">新手指南</a></li>
            <li><a href="#">社区规范</a></li>
            <li><a href="#">常见问题</a></li>
            <li><a href="#">隐私政策</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2024 Nemo社区. All rights reserved. | <a href="#">京ICP备XXXXXXXX号</a></p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
